<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lo que sé de ti</title>
    <link rel="stylesheet" href="/src/memoria.css" />
  </head>
  <body>
    <header class="cabecera">
      <div>
        <h1>Lo que sé de ti 🌱</h1>
        <p class="bajada">Todo lo que Brote recuerda. Puedes corregirlo u olvidarlo.</p>
      </div>
      <div class="cabecera-derecha">
        <span class="sin-ia" id="sin-ia" hidden></span>
        <button type="button" class="enlace" id="configurar">⚙︎ Configurar</button>
      </div>
    </header>
    <div class="barra">
      <input class="buscar" id="buscar" type="search" placeholder="Buscar en todo lo que sé de ti (ej.: cálculo, notebook)" autocomplete="off" />
      <div class="tema" id="tema" hidden>
        <span id="tema-texto"></span>
        <button type="button" class="boton boton-peligro" id="tema-olvidar"></button>
      </div>
      <p class="aviso" id="aviso" hidden></p>
    </div>
    <div class="cuerpo">
      <nav class="nav" id="nav" aria-label="Qué guarda Brote"></nav>
      <main id="secciones" aria-live="polite"></main>
    </div>
    <script type="module" src="/src/memoria.ts"></script>
  </body>
</html>
