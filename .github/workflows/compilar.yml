# Compila Brote para macOS y Windows en las máquinas de GitHub y deja los instaladores como
# artefactos descargables. Se lanza a mano (pestaña Actions → "Compilar Brote" → Run workflow)
# o al subir una etiqueta v* (por ejemplo, v0.1.0).
name: Compilar Brote

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - sistema: macos-latest
            nombre: macos
            instaladores: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - sistema: windows-latest
            nombre: windows
            instaladores: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.sistema }}
    steps:
      - uses: actions/checkout@v4

      # pnpm toma la versión del campo "packageManager" del package.json raíz.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Pruebas
        run: |
          pnpm --dir packages/motor test
          pnpm --dir packages/adapter test
          pnpm --dir apps/desktop test
          pnpm --dir apps/desktop tipos

      # Incluye el puente, el servidor de gastos y el asistente de configuración (beforeBuildCommand).
      - name: Compilar la app
        run: pnpm --dir apps/desktop tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: brote-${{ matrix.nombre }}
          path: ${{ matrix.instaladores }}
          if-no-files-found: error
