<!doctype html>
<!--
  Vista previa de la isla en un navegador, para trabajar el diseño sin abrir la app: simula Tauri y
  el puente con datos de ejemplo (pomodoro, calendario, entregas del aula, música, una descarga y una
  sesión de Claude Code). Con `tauri dev` (o `pnpm dev`) corriendo: http://localhost:1420/vista-previa.html
  Parámetros: ?pestana=brote|chat|claude|equipo (chat = la pestaña Brote con una pregunta enviada: las
  tarjetas se encogen a píldoras) · ?permiso=1 (Brote pide permiso) · ?cerrada=1 (sin abrir la isla) · ?aviso=descarga|calendario|claude|plata (un aviso sin abrir la isla) ·
  ?vacia=1 (sin datos) · ?plataforma=windows (la isla de Windows, con su notch simulado) · ?modo=flotante (la ventana flotante, que ya no es la de Windows) · ?ocultas=musica,descargas (tarjetas
  ocultas en Configurar Brote) · ?apagadas=equipo,programador (funciones apagadas) · ?plan=con|sin|sin-statusline|limite|app|reiniciado
  (el uso del plan de Claude en la pestaña Claude: con datos, sin datos todavía, sin la statusline instalada,
  cerca del límite con el aviso de 95 %, leído de la app de Claude con la hora estimada, o con la sesión de
  5 h ya reiniciada). El botón ↻ simula la consulta mínima. ?delegar=1 (Brote le pasa la pregunta a su
  equipo: las mascotas de 🔎 Investigador con Gemini, 📚 Tutor con Claude y ✍️ Redactor con ChatGPT salen de
  detrás de Brote, piensan, buscan, piden permiso, escriben y celebran; después la respuesta de Brote) ·
  ?freno=1 (el aviso del freno por plan: los especialistas con Claude salen del equipo) · &todos=1 (abre
  "Ver a todos") · &conversacion=1 (abre la conversación del Investigador) ·
  ?pestana=plata (la pestaña Plata con tres meses de gastos de ejemplo) y ?plata=sin|pasado|nuevo (sin
  presupuesto, pasado del presupuesto con el aviso del 100 %, o sin ningún gasto todavía). Los botones de un
  toque y "mi presupuesto es…" funcionan.
  No es parte de la app (no está entre las páginas de vite.config.ts).
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Vista previa de la isla</title>
    <link rel="stylesheet" href="/src/estilos.css" />
    <style>
      html {
        background: radial-gradient(120% 90% at 30% 10%, #3b3f7a, #14152b 60%, #0a0a14) !important;
        min-height: 100%;
      }
      body {
        position: relative;
        width: 760px !important;
        height: 460px !important;
        margin: 0 auto !important;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      /* La ventana del notch mide 760 × 460 (lib.rs). El modo flotante (Windows) vive en una de 400 × 280. */
      body.flotante {
        width: 400px !important;
        height: 280px !important;
        margin-top: 40px !important;
      }
    </style>
    <script>
      const parametros = new URLSearchParams(location.search);
      const vacia = parametros.has("vacia");
      const ahora = Date.now();
      const datos = vacia
        ? {
            temporizadores: [],
            musica: null,
            calendario: { proximo: null, etiqueta: null },
            aula: { configurada: false, proxima: null, pendientes: 0, error: null },
            programador: { sesiones: [], permisos: [] },
          }
        : {
            temporizadores: [
              { id: 1, tipo: "pomodoro", etiqueta: "cálculo", fase: "estudio", ciclos: 1, finMs: ahora + 18 * 60_000 + 42_000, duracionMs: 25 * 60_000 },
            ],
            musica: { app: "Spotify", sonando: true, cancion: "Demons", artista: "Imagine Dragons" },
            calendario: {
              proximo: { titulo: "Cálculo II", lugar: "Sala B-12", inicioMs: ahora + 25 * 60_000, finMs: ahora + 115 * 60_000, todoElDia: false },
              etiqueta: "Cálculo II en 25 min",
            },
            aula: {
              configurada: true,
              proxima: { curso: "Física I", titulo: "Laboratorio 4: péndulo", entregaMs: ahora + 20 * 3_600_000, url: null, entregada: false },
              pendientes: 3,
              error: null,
            },
            programador: {
              sesiones: [
                { id: "s1", proyecto: "Asistente-multiplataforma", estado: "trabajando", actividad: "Editando isla.ts…", ultimaActividadMs: ahora },
                { id: "s2", proyecto: "tarea-rust", estado: "lista", actividad: "Terminó", ultimaActividadMs: ahora - 60_000 },
              ],
              permisos: [],
            },
          };
      // Uso del plan de Claude (pestaña Claude), como lo manda el puente.
      // ?plan=con|sin|sin-statusline|limite|app|reiniciado
      const modoPlan = parametros.get("plan") ?? "con";
      const total = (entrada, salida, cache, usd, sinPrecio = 0) => ({ entrada, salida, cache, usd, sinPrecio });
      const periodo = (f) => ({
        total: total(41_000 * f, 182_000 * f, 9_400_000 * f, 21.37 * f),
        brote: total(6_000 * f, 22_000 * f, 610_000 * f, 0.82 * f),
        tuyas: total(35_000 * f, 160_000 * f, 8_790_000 * f, 20.55 * f),
        porModelo: [],
        proyectos: [
          { nombre: "Asistente-multiplataforma", brote: false, total: total(0, 0, 0, 14.2 * f) },
          { nombre: "tarea-rust", brote: false, total: total(0, 0, 0, 6.35 * f) },
          { nombre: "Brote", brote: true, total: total(0, 0, 0, 0.82 * f) },
        ],
      });
      const precio = (nombre, entrada, escritura5m, escritura1h, lectura, salida) => ({ nombre, entrada, escritura5m, escritura1h, lectura, salida });
      const cerca = modoPlan === "limite";
      const uso = {
        plan:
          modoPlan === "sin" || modoPlan === "sin-statusline"
            ? null
            : modoPlan === "app"
            ? {
                sesion: { porcentaje: 0, reiniciaMs: null, estimado: true },
                semana: { porcentaje: 76, reiniciaMs: ahora + 30 * 3_600_000, estimado: true },
                modelo: null,
                actualizadoMs: ahora - 6 * 60_000,
                fuente: "app",
              }
            : modoPlan === "reiniciado"
            ? {
                sesion: { porcentaje: 64, reiniciaMs: ahora - 25 * 60_000 },
                semana: { porcentaje: 41, reiniciaMs: ahora + 4 * 86_400_000 },
                modelo: null,
                actualizadoMs: ahora - 3 * 3_600_000,
                fuente: "consulta",
              }
            : {
                sesion: { porcentaje: cerca ? 96 : 23, reiniciaMs: ahora + 2 * 3_600_000 + 10 * 60_000 },
                semana: { porcentaje: cerca ? 78 : 41, reiniciaMs: ahora + 4 * 86_400_000 + 16 * 3_600_000 },
                modelo: "claude-sonnet-5",
                actualizadoMs: ahora - 3 * 60_000,
                fuente: "statusline",
              },
        statusline: modoPlan !== "sin-statusline",
        resumen: vacia ? null : { hoy: periodo(1), semana: periodo(5.2), modelos: ["claude-sonnet-5", "claude-haiku-4-5-20251001"], calculadoMs: ahora },
        precios: {
          fecha: "2026-10-03",
          fuente: "https://platform.claude.com/docs/en/about-claude/pricing",
          modelos: [
            { id: "claude-sonnet-5", precio: precio("Sonnet 5", 2, 2.5, 4, 0.2, 10) },
            { id: "claude-haiku-4-5-20251001", precio: precio("Haiku 4.5", 1, 1.25, 2, 0.1, 5) },
          ],
        },
      };

      // Configurar Brote → Funciones, como lo manda el puente.
      const lista = (nombre) => (parametros.get(nombre) ?? "").split(",").filter(Boolean);
      const funciones = {
        activas: Object.fromEntries(
          ["gastos", "temporizadores", "calendario", "aula", "musica", "descargas", "equipo", "programador", "uso-del-plan", "memoria-local", "especialistas"].map((id) => [id, !lista("apagadas").includes(id)]),
        ),
        tarjetas: { orden: ["temporizadores", "calendario", "aula", "musica", "descargas", "claude"], ocultas: lista("ocultas") },
      };
      const equipo = (cpu) => ({
        animo: null,
        lectura: {
          bateria: { porcentaje: 64, conectado: false },
          cpu,
          disco: { libre: 83 * 1024 ** 3, total: 494 * 1024 ** 3 },
          procesoPesado: "Google Chrome",
          memoria: { total: 16 * 1024 ** 3, libre: 4.6 * 1024 ** 3 },
        },
      });

      // Aunque el navegador no esté a la vista, la isla sigue atendiendo al "cursor".
      Object.defineProperty(document, "hidden", { get: () => false });

      // Tauri simulado: los comandos que usa main.ts y el evento "puente".
      const callbacks = new Map();
      let siguiente = 1;
      let manejadorPuente = null;
      let mouse = { x: 300, y: 60 };
      addEventListener("mousemove", (e) => (mouse = { x: e.clientX, y: e.clientY }));
      const emitir = (aviso) => manejadorPuente && callbacks.get(manejadorPuente)?.({ event: "puente", id: 0, payload: JSON.stringify(aviso) });
      const responder = (id, extra) => setTimeout(() => emitir({ tipo: "respuesta", id, ok: true, ...extra }), 120);
      let t = 0;

      window.__TAURI_INTERNALS__ = {
        metadata: { currentWindow: { label: "personaje" }, currentWebview: { windowLabel: "personaje", label: "personaje" } },
        transformCallback(cb) {
          const id = siguiente++;
          callbacks.set(id, cb);
          return id;
        },
        unregisterCallback(id) {
          callbacks.delete(id);
        },
        async invoke(comando, args) {
          switch (comando) {
            case "diseno":
              // ?plataforma=windows: la isla de Windows, con su "notch" simulado más chico.
              const windows = parametros.get("plataforma") === "windows";
              return { modo: parametros.get("modo") === "flotante" ? "flotante" : "notch", notchAncho: windows ? 130 : 185, notchAlto: windows ? 30 : 32 };
            case "agente_modo":
              return "real";
            case "agente_conexion":
              return JSON.stringify({ tipo: "conexion", conectado: true });
            case "plugin:event|listen":
              if (args.event === "puente") manejadorPuente = args.handler;
              return args.handler;
            case "cursor_relativo": {
              // El cursor "está" sobre la isla (o lejos, con ?cerrada=1); los ojos siguen el mouse real.
              const caja = document.body.getBoundingClientRect();
              if (parametros.has("cerrada")) return { x: mouse.x - caja.left - caja.width / 2, y: 400 };
              // Flotante: el cursor sobre Brote (abajo a la derecha), que es lo que abre el panel.
              if (parametros.get("modo") === "flotante") return { x: caja.width / 2 - 62, y: caja.height / 2 - 50 };
              return { x: Math.max(-120, Math.min(120, mouse.x - caja.left - caja.width / 2)), y: -caja.height / 2 + 20 };
            }
            case "agente_escribir": {
              const pedido = JSON.parse(args.linea);
              const id = pedido.id;
              switch (pedido.tipo) {
                case "funciones-estado":
                  return responder(id, { datos: funciones });
                case "temporizadores-listar":
                  return responder(id, { datos: datos.temporizadores });
                case "musica-estado":
                  return responder(id, { datos: datos.musica });
                case "calendario-estado":
                  return responder(id, { datos: datos.calendario });
                case "aula-estado":
                  return responder(id, { datos: datos.aula });
                case "programador-estado":
                  return responder(id, { datos: datos.programador });
                case "uso-estado":
                  return responder(id, { datos: uso });
                case "plan-actualizar":
                  // El botón ↻: la "consulta mínima" tarda unos segundos y trae el plan con su hora exacta.
                  emitir({ tipo: "uso", ...uso, consultando: true });
                  uso.plan = {
                    sesion: { porcentaje: 22, reiniciaMs: Date.now() + 4 * 3_600_000 + 40 * 60_000 },
                    semana: { porcentaje: 76, reiniciaMs: Date.now() + 27 * 3_600_000 },
                    modelo: null,
                    actualizadoMs: Date.now(),
                    fuente: "consulta",
                  };
                  return setTimeout(() => emitir({ tipo: "respuesta", id, ok: true, datos: { ...uso, consultando: false } }), 2500);
                case "equipo-estado":
                  t += 1;
                  return responder(id, { datos: equipo(0.18 + 0.12 * Math.sin(t / 2) + 0.05 * Math.sin(t * 1.7)) });
                case "plata-estado":
                  return responder(id, { datos: window.__plata.estado() });
                case "plata-anotar":
                  window.__plata.anotar(pedido.monto, pedido.descripcion);
                  setTimeout(() => emitir({ tipo: "plata", plata: window.__plata.estado() }), 150);
                  return responder(id, { mensaje: `Anotado: $${pedido.monto.toLocaleString("es-CL")} en ${pedido.descripcion}. Este mes llevas $${window.__plata.estado().mes.total.toLocaleString("es-CL")}.` });
                case "presupuesto-poner":
                  window.__plata.presupuesto(pedido.monto);
                  emitir({ tipo: "plata", plata: window.__plata.estado() });
                  return responder(id, { datos: window.__plata.estado() });
                case "especialistas-estado":
                  return responder(id, { datos: { lista: [], frenado: parametros.has("freno") } });
                case "enviar":
                  // Con ?delegar=1 Brote le pasa la pregunta a su equipo (así lo dejaría el puente): las
                  // mascotas salen de detrás de Brote, piensan, buscan, escriben y celebran al terminar.
                  if (parametros.has("delegar")) {
                    responder(id, {});
                    const marco = (stream, data) => emitir({ tipo: "evento", marco: { event: "agent", payload: { runId: "r2", stream, data } } });
                    const inicio = Date.now();
                    const final = parametros.has("todos") || parametros.has("conversacion") ? 45_000 : parametros.get("pestana") === "chat" ? 12_000 : 20_000;
                    const equipo = [
                      { sesion: "agent:investigador:subagent:1", id: "investigador", nombre: "Investigador", emoji: "🔎", ia: "Gemini", color: "#5b8def", tarea: "Busca fuentes sobre la fotosíntesis para primer año", tareaCompleta: "Busca dos fuentes confiables sobre la fotosíntesis para un estudiante de primer año y resume qué dicen, con sus enlaces." },
                      { sesion: "agent:tutor:subagent:2", id: "tutor", nombre: "Tutor", emoji: "📚", ia: "Claude", color: "#d9825b", tarea: "Arma 3 preguntas de práctica sobre la fotosíntesis", tareaCompleta: "Arma 3 preguntas de práctica sobre la fotosíntesis, con su solución aparte." },
                      { sesion: "agent:redactor:subagent:3", id: "redactor", nombre: "Redactor", emoji: "✍️", ia: "ChatGPT", color: "#3fa37a", tarea: "Resume todo en un párrafo", tareaCompleta: "Cuando lleguen las fuentes, resume la fotosíntesis en un párrafo claro para una prueba." },
                    ].map((e) => ({ ...e, herramienta: null, args: null, estado: "trabajando", actividad: "en-espera", pasos: [], respuesta: "", inicioMs: inicio, finMs: null }));
                    const [inv, tut, red] = equipo;
                    const avisar = () => emitir({ tipo: "especialistas", lista: equipo.map((e) => ({ ...e, pasos: e.pasos.map((p) => ({ ...p })) })) });
                    const paso = (e, herramienta, args) => {
                      e.pasos.forEach((p) => p.estado === "en-curso" && (p.estado = "ok"));
                      e.pasos.push({ id: String(e.pasos.length), herramienta, args, estado: "en-curso" });
                      Object.assign(e, { herramienta, args, actividad: "trabajando" });
                    };
                    const pensar = (e) => {
                      e.pasos.forEach((p) => p.estado === "en-curso" && (p.estado = "ok"));
                      Object.assign(e, { herramienta: null, args: null, actividad: "pensando" });
                    };
                    const escribir = (e, texto) => Object.assign(e, { herramienta: null, args: null, actividad: "trabajando", respuesta: texto });
                    const terminar = (e) => {
                      e.pasos.forEach((p) => p.estado === "en-curso" && (p.estado = "ok"));
                      Object.assign(e, { estado: "termino", herramienta: null, args: null, finMs: Date.now() });
                    };
                    const respuestaInv = "La **fotosíntesis** es el proceso con que las plantas usan la luz para transformar agua y CO₂ en glucosa y oxígeno.\n\n- Khan Academy: https://es.khanacademy.org/science/biology/photosynthesis\n- Wikipedia: https://es.wikipedia.org/wiki/Fotosíntesis";
                    const respuestaTut = "1. ¿Qué gas liberan las plantas en la fotosíntesis?\n2. ¿Dónde ocurre, dentro de la célula?\n3. ¿Por qué la luz es necesaria?\n\nSoluciones: oxígeno · cloroplastos · da la energía para la reacción.";
                    const pasos = [
                      [200, () => marco("lifecycle", { phase: "start" })],
                      [500, () => marco("tool", { phase: "start", name: "mcp__openclaw__sessions_spawn", toolCallId: "t1", args: {} })],
                      [800, avisar],
                      [1700, () => { inv.actividad = tut.actividad = red.actividad = "pensando"; avisar(); }],
                      [1900, () => marco("tool", { phase: "result", name: "mcp__openclaw__sessions_spawn", toolCallId: "t1" })],
                      [2000, () => marco("tool", { phase: "start", name: "mcp__openclaw__subagents", toolCallId: "t2", args: {} })],
                      [2800, () => { paso(inv, "web_search", { query: "fotosíntesis primer año" }); avisar(); }],
                      [4200, () => { paso(inv, "web_fetch", { url: "https://es.khanacademy.org/science/biology/photosynthesis" }); paso(tut, "Read", { file_path: "/Users/tu/apuntes/biologia.md" }); avisar(); }],
                      [6200, () => { tut.actividad = "permiso"; paso(red, "Write", { file_path: "/Users/tu/borrador.md" }); red.actividad = "permiso"; avisar(); }],
                      [7600, () => { paso(inv, "web_fetch", { url: "https://es.wikipedia.org/wiki/Fotos%C3%ADntesis" }); tut.actividad = "trabajando"; pensar(tut); avisar(); }],
                      [9200, () => { pensar(inv); escribir(tut, respuestaTut.slice(0, 60)); red.actividad = "trabajando"; avisar(); }],
                      [10600, () => { escribir(inv, respuestaInv.slice(0, 90)); escribir(tut, respuestaTut); avisar(); }],
                      [12400, () => { escribir(inv, respuestaInv); terminar(tut); avisar(); }],
                      [final * 0.75, () => { terminar(inv); avisar(); }],
                      [final * 0.82, () => { escribir(red, "La fotosíntesis convierte la luz del sol en alimento para la planta: con agua y CO₂ fabrica glucosa y libera oxígeno."); terminar(red); avisar(); }],
                      [final * 0.86, () => marco("tool", { phase: "result", name: "mcp__openclaw__subagents", toolCallId: "t2" })],
                      [final * 0.92, () => marco("assistant", { text: "¡Listo! El Investigador encontró que la fotosíntesis es cuando las plantas usan la luz para convertir agua y CO₂ en glucosa y oxígeno (Khan Academy), y el Tutor te dejó 3 preguntas para practicar 🌱" })],
                      [final, () => marco("lifecycle", { phase: "end" })],
                    ];
                    for (const [ms, accion] of pasos) setTimeout(accion, ms);
                    // ?todos=1 abre "Ver a todos"; ?conversacion=1, la conversación del Investigador.
                    if (parametros.has("todos")) setTimeout(() => document.querySelector(".ver-todos")?.click(), 3500);
                    if (parametros.has("conversacion")) setTimeout(() => document.querySelector(".lugar-mascota")?.click(), 11_000);
                    return;
                  }
                  // Con ?permiso=1 la pregunta va al "agente", que pide permiso para un comando.
                  if (parametros.has("permiso")) {
                    responder(id, {});
                    setTimeout(() => emitir({ tipo: "evento", marco: { event: "agent", payload: { runId: "r1", stream: "lifecycle", data: { phase: "start" } }, seq: 1 } }), 200);
                    setTimeout(
                      () =>
                        emitir({
                          tipo: "evento",
                          marco: {
                            event: "session.approval",
                            payload: {
                              phase: "pending",
                              approval: {
                                id: "a1",
                                presentation: {
                                  kind: "plugin",
                                  title: "claude-cli native tool: Bash",
                                  detail: JSON.stringify({ command: "ls ~/Documentos/universidad", description: "List files" }),
                                  toolName: "Bash",
                                  allowedDecisions: ["allow-once", "deny"],
                                },
                              },
                            },
                            seq: 2,
                          },
                        }),
                      500,
                    );
                    return;
                  }
                  // "mi presupuesto es 200 lucas": como lo haría el motor, sin IA.
                  const presupuesto = /presupuesto es\s*(\d+)\s*(lucas|mil|k)?/i.exec(pedido.texto ?? "");
                  if (presupuesto) {
                    const monto = Number(presupuesto[1]) * (presupuesto[2] ? 1000 : 1);
                    window.__plata.presupuesto(monto);
                    setTimeout(() => emitir({ tipo: "plata", plata: window.__plata.estado() }), 150);
                    return responder(id, { local: { texto: `Listo: tu presupuesto es $${monto.toLocaleString("es-CL")} al mes 💰.`, intencion: "presupuesto-poner" } });
                  }
                  return responder(id, {
                    local: { texto: "Esta semana llevas **$23.500**: comida $11.000, transporte $7.500 y otros $5.000.", intencion: "total-periodo" },
                  });
                default:
                  return responder(id, {});
              }
            }
            default:
              return null;
          }
        },
      };

      // Cerca del límite: el aviso de 95 % de la sesión, como llegaría del puente.
      if (cerca) setTimeout(() => emitir({ tipo: "plan-aviso", texto: "Llevas 95 % de tu sesión de Claude; se reinicia a las 18:40" }), 2500);
      // Pasado del presupuesto: el aviso del 100 %, como lo mandaría el puente.
      if (parametros.get("plata") === "pasado") setTimeout(() => emitir({ tipo: "plata-aviso", texto: "🚨 Te pasaste del presupuesto del mes: llevas $412.000 de $250.000. Nada de dramas: desde mañana vamos con calma 🌱" }), 2200);
      // El freno por plan, como lo avisaría el puente.
      if (parametros.has("freno")) setTimeout(() => emitir({ tipo: "especialistas-aviso", texto: "Tu plan semanal de Claude va alto (87 %): no le paso tareas a los especialistas con Claude hasta que baje. Los de otras IA siguen." }), 2000);
      // ?aviso=descarga|calendario|claude|plata: un aviso que no abre la isla (con ?cerrada=1 se ve en el ala).
      const avisoPrueba = {
        descarga: { tipo: "descarga-lista", descarga: { nombre: "apunte-calculo.pdf", ruta: "/tmp/apunte-calculo.pdf", tamano: 2 * 1024 ** 2, fechaMs: Date.now() } },
        calendario: { tipo: "calendario-aviso", texto: "📅 Cálculo II en 10 min" },
        claude: { tipo: "programador-reaccion", reaccion: "termino", proyecto: "tarea-rust" },
        plata: { tipo: "plata-aviso", texto: "💸 Llevas 80 % de tu presupuesto del mes" },
      }[parametros.get("aviso")];
      // Se repite cada 10 s para poder mirarlo con calma.
      if (avisoPrueba) {
        setTimeout(() => emitir(avisoPrueba), 1500);
        setInterval(() => emitir(avisoPrueba), 10_000);
      }
      // Una descarga en curso, como llegaría del puente.
      if (!vacia) setTimeout(() => emitir({ tipo: "descargas", enCurso: [{ id: "d1", nombre: "session10_intro_ml.pdf", tamano: 3.4 * 1024 ** 2 }] }), 600);
      // La pestaña pedida: se elige con un clic, como lo haría el usuario.
      const pestana = parametros.get("pestana");
      if (pestana || parametros.has("permiso") || parametros.has("delegar")) {
        setTimeout(() => {
          const titulos = { brote: "Brote", plata: "Plata", claude: "Claude", equipo: "Equipo" };
          if (pestana === "chat" || parametros.has("permiso") || parametros.has("delegar")) {
            const entrada = document.querySelector(".entrada");
            entrada.value = parametros.has("delegar") ? "Pídele al equipo que me ayude a estudiar la fotosíntesis" : "¿cuánto llevo esta semana?";
            entrada.dispatchEvent(new Event("input"));
            document.querySelector(".formulario").requestSubmit();
          } else document.querySelector(`.pestana[title="${titulos[pestana]}"]`)?.click();
        }, 1500);
      }
    </script>
    <script type="module">
      // La pestaña Plata con el cálculo de verdad (motor/plata.ts) sobre gastos de ejemplo.
      import { resumenPlata } from "/src/agente/plata.ts";
      const modo = new URLSearchParams(location.search).get("plata");
      const hoy = new Date();
      const en = (dias, hora, monto, categoria, descripcion) => ({ monto, categoria, descripcion, fechaMs: new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() - dias, hora, 10).getTime() });
      const lista = [];
      if (modo !== "nuevo") {
        for (let d = 95; d >= 0; d--) {
          if (d % 2 === 0) lista.push(en(d, 9, 1500, "comida", "café"));
          if (d % 7 !== 5 && d % 7 !== 6) lista.push(en(d, 8, 800, "transporte", "micro"));
          if (d % 3 === 1) lista.push(en(d, 13, 4500, "comida", "almuerzo"));
          if (d % 11 === 3) lista.push(en(d, 21, 12000, "salidas", "carrete"));
        }
        for (const meses of [1, 2, 3]) lista.push({ monto: 8990, categoria: "salidas", descripcion: "Netflix", fechaMs: new Date(hoy.getFullYear(), hoy.getMonth() - meses, 12, 10).getTime() });
        lista.push(en(1, 19, 9000, "transporte", "uber"), en(3, 23, 7000, "transporte", "uber"), en(0, 0, 6500, "transporte", "uber"));
        lista.push(en(9, 15, 3000, "transporte", "uber"));
        lista.push(en(2, 11, 18000, "estudio", "libro de cálculo"), en(0, 12, 3500, "salud", "farmacia"));
        if (modo === "pasado") lista.push(en(0, 10, 150000, "cuentas", "arriendo"));
      }
      const datos = { lista: lista.filter((g) => g.fechaMs <= Date.now()).map((g, i) => ({ id: i + 1, ...g })), presupuesto: modo === "sin" || modo === "nuevo" ? null : 250000 };
      window.__plata = {
        estado: () => resumenPlata(datos.lista, datos.presupuesto, Date.now()),
        anotar: (monto, descripcion) => {
          const categoria = descripcion === "micro" ? "transporte" : "comida";
          datos.lista.push({ id: datos.lista.length + 1, monto, categoria, descripcion, fechaMs: Date.now() });
        },
        presupuesto: (monto) => (datos.presupuesto = monto),
      };
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>

    <script>
      if (parametros.get("modo") === "flotante") document.body.classList.add("flotante");
    </script>
